name: Python reference parity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Read reference revisions
        id: reference
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import p from './test/fixtures/provenance.json' with {type: 'json'};
          for (const key of ['coreCommit', 'migrationCommit']) {
            if (!/^[0-9a-f]{40}$/.test(p[key])) throw new Error('Invalid reference revision');
            console.log(`${key}=${p[key]}`);
          }
          JS
      - uses: actions/checkout@v7.0.1
        with:
          repository: asqueel-org/asqueel
          ref: '${{ steps.reference.outputs.coreCommit }}'
          path: .reference/asqueel
      - uses: actions/checkout@v7.0.1
        with:
          repository: asqueel-org/asqueel-migration
          ref: '${{ steps.reference.outputs.migrationCommit }}'
          path: .reference/asqueel-migration
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-parity.txt
      - run: npm run verify:python
        env:
          PYTHON: python
          ASQUEEL_PYTHON_ROOT: '${{ github.workspace }}/.reference/asqueel'
          ASQUEEL_MIGRATION_ROOT: '${{ github.workspace }}/.reference/asqueel-migration'
